name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # The examples' vite configs import the built plugin, so these run after
      # the build. `check` runs svelte-kit sync + svelte-check.
      - name: Type-check example apps
        run: pnpm --filter "./example*" check
      # Regenerates the worker types without starting vite dev (#9) and fails
      # if the committed worker-configuration.d.ts is stale.
      - name: Check example worker types are up to date
        run: pnpm --filter "./example*" types:check
      - name: Check example app formatting
        run: pnpm --filter "./example*" format:check
      - name: Acceptance tests (example apps, dev + built mode)
        run: pnpm test:acceptance
